services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: simulador
      POSTGRES_PASSWORD: simulador
      POSTGRES_DB: simulador
    ports:
      - '5432:5432'
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U simulador']
      interval: 5s
      retries: 10

volumes:
  dados-postgres:
