# Empacotamento para Windows, macOS e Linux (RNF05). Gere com `npm run dist --workspace app`
# no sistema operacional de destino.
appId: br.mackenzie.simulador-investimentos
productName: Simulador de Investimentos
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.finance
linux:
  target: AppImage
  category: Finance
