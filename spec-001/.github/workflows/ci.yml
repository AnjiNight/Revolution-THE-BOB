name: CI

on:
  pull_request:
  push:
    branches: [development, main]

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  migracoes:
    name: Migrações reversíveis (aplicar → reverter → aplicar)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      DATABASE_URL: postgresql://simulador:simulador@localhost:5432/simulador
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: simulador
          POSTGRES_PASSWORD: simulador
          POSTGRES_DB: simulador
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U simulador"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:rollback
      - run: npm run db:migrate
